page_name: Best Friends Forever
page_description: Utilities for you and your followers.
page_HUD_name: "Best Friends Forever: HUD"
page_HUD_description: |
  Settings for Best Friends Forever's HUD and more.

  Did you know the follower widgets have tooltips and are clickable?

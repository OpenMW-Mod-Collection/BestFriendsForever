page_Menu_name: "Best Friends Forever: Menu"
page_Menu_description: |
  Settings for everything Interaction Menu.

  Click on the follower widget to open their Interaction Menu.

toggles_groupName: Toggles
enableTeleport_name: Enable Teleporting
enableTeleport_desc: |
  Your followers follow you everywhere without any exceptions.

  Might cause issues with certain scripted events, but that's rare.
enableImmortality_name: Enable Immortal Followers
enableImmortality_desc: |
  Instead of dying, your followers will get knocked down for a set amount of time or until the end of combat.

  Might cause issues with certain scripted events, but that's rare.
enableCatchUp_name: Enable Catch Up
enableCatchUp_desc: >
  Your followers will always keep up with you, no matter how fast you'll go.
enableWard_name: Enable Ward
enableWard_desc: Protects your followers from diseases and stat damage. Cheat zone.
blacklist_groupName: Blacklisting
globalScriptBlacklist_name: Global Blacklist by MWScripts
globalScriptBlacklist_desc: >
  Disables every feature of the mod for actors with these MWScripts attached.
teleportBlacklistMWScript_name: Disable Teleporting for Everyone with MWScripts
teleportScriptBlacklist_name: Teleporting Blacklist by MWScripts
immortalityBlacklistMWScript_name: Disable Immortality for Everyone with MWScripts
immortalityScriptBlacklist_name: Immortality Blacklist by MWScripts
immortality_groupName: Immortality
immortality_groupDesc: |
  Instead of dying, your followers will get knocked down.

  Doesn't affect summons.
ingoreCommanded_name: Command Effects Prevent Getting Knocked Down
ingoreCommanded_desc: |
  Followers under Command effects don't get knocked down and die as usual.

  Casting command spells on already downed followers won't do anything.

  Any Command effect, any magnitude.
threshold_name: Health Threshold
threshold_desc: At which health follower will get knocked down.
changeAggro_name: Change Enemy Aggro if the Follower is Down
changeAggro_desc: >
  If an enemy targets the downed follower, they will change aggro onto you.
waitUntilCombatEnds_name: Get Up Only Once Combat Ends
upDelay_name: Getting Up Delay (sec)
upDelay_desc: Ignored if "Get Up Only Once Combat Ends" is enabled.
ward_groupName: Ward
ward_groupDesc: Protecting followers from diseases and stat damage.
protections_name: Protection
statDamageCheckFrequency_name: Stat Damage Check Frequency (sec)
call_groupName: Call
call_groupDesc: Keybind which teleports your followers to you.
callKeybind_name: Keybind
callKeybind_desc: Teleports all your followers to you.
callAction_name: Call
callDistance_name: Teleportation Distance
callDistance_desc: |
  X > 0 = behind you,
  X < 0 = in front of you.
catchUp_groupName: Catch Up
catchUp_groupDesc: Gradually speeds up followers if they get too far.
distances_name: Catch Up Distances
distances_desc: Distances at which followers start building up and reach maximum speed.
startDist: Starting Distance
maxDist: Maximum Distance
updateInterval_name: Catch Up Update Interval (sec)
updateInterval_desc: How often follower speed is recalculated. Set it to zero to recalculate every frame.

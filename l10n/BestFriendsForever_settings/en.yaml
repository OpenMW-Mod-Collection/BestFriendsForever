pollingRate_desc: Set it to zero to update HUD every frame.
dragModifier_name: Drag Modifier
dragModifier_desc: |
  Hold the selected modifier while dragging the HUD with LMB.
  
  "None" needs no modifier.

  "Disabled" locks the HUD in place and disables all Tooltips and Interaction Menu.
